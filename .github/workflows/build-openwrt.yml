name: build-openwrt

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Image flavor
        required: true
        default: lite
        type: choice
        options:
          - lite
          - server
      device:
        description: Device profile
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - nanopi-r4s
          - nanopi-r5s

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Policy check
        run: python3 scripts/check-component-policy.py
      - name: Package availability check
        run: python3 scripts/check-package-set.py --version lite --device x86_64

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: scripts/build.sh "${{ inputs.version }}" "${{ inputs.device }}"
      - name: Collect artifacts
        run: |
          out="artifacts/${{ inputs.version }}-${{ inputs.device }}"
          python3 scripts/collect-artifacts.py "$GITHUB_WORKSPACE/work/openwrt" "${{ inputs.device }}" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.version }}-${{ inputs.device }}
          path: artifacts/${{ inputs.version }}-${{ inputs.device }}
