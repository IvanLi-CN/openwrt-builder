name: build-openwrt

on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Image flavor
        required: true
        default: lite
        type: choice
        options:
          - lite
          - server
      device:
        description: Device profile
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - nanopi-r4s
          - nanopi-r5s
      lan:
        description: Default LAN IPv4 address
        required: false
        default: 192.168.31.1
        type: string
      publish_release:
        description: Publish build outputs to a GitHub Release
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag to publish when publish_release is true
        required: false
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Policy check
        run: python3 scripts/check-component-policy.py
      - name: Package availability check
        run: python3 scripts/check-package-set.py --version lite --device x86_64

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/share/dotnet
          sudo docker image prune -af || true
          df -h
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev \
            libssl-dev python3 rsync unzip zlib1g-dev file wget curl ca-certificates \
            qemu-utils qemu-system-x86 cpio xz-utils patch perl libelf-dev swig time subversion \
            python3-setuptools python3-dev libzstd-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build image
        run: |
          export WORKDIR="$GITHUB_WORKSPACE/work"
          export DL_DIR="$GITHUB_WORKSPACE/dl"
          export JOBS="$(nproc)"
          export LAN="${{ inputs.lan }}"
          scripts/build.sh "${{ inputs.version }}" "${{ inputs.device }}"
      - name: Collect artifacts
        run: |
          out="artifacts/${{ inputs.version }}-${{ inputs.device }}"
          python3 scripts/collect-artifacts.py "$GITHUB_WORKSPACE/work/openwrt" "${{ inputs.device }}" "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-${{ inputs.version }}-${{ inputs.device }}
          path: artifacts/${{ inputs.version }}-${{ inputs.device }}
          retention-days: 1
      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          DEVICE: ${{ inputs.device }}
          OUT_DIR: artifacts/${{ inputs.version }}-${{ inputs.device }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            RELEASE_TAG="openwrt-${VERSION}-${DEVICE}-${GITHUB_RUN_NUMBER}"
          fi
          title="OpenWrt ${VERSION} ${DEVICE} ${GITHUB_RUN_NUMBER}"
          notes="$(mktemp)"
          {
            echo "OpenWrt ${VERSION} ${DEVICE} build."
            echo
            echo "Build evidence:"
            echo "- Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo
            echo "Verify downloads with sha256sums.txt."
          } > "$notes"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release already exists: $RELEASE_TAG" >&2
            exit 1
          fi

          for required_asset in "$OUT_DIR/sha256sums.txt" "$OUT_DIR/buildinfo.tar.gz"; do
            if [ ! -s "$required_asset" ]; then
              echo "missing required release asset: $required_asset" >&2
              exit 1
            fi
          done

          if ! awk -F '  ' '
            NF != 2 || length($1) != 64 || $1 !~ /^[[:xdigit:]]+$/ || $2 == "" || $2 ~ /\// { exit 1 }
          ' "$OUT_DIR/sha256sums.txt"; then
            echo "invalid sha256sums.txt" >&2
            exit 1
          fi
          mapfile -t release_asset_names < <(awk -F '  ' '{ print $2 }' "$OUT_DIR/sha256sums.txt" | sort -u)
          if [ "${#release_asset_names[@]}" -eq 0 ]; then
            echo "no checksummed release assets found" >&2
            exit 1
          fi
          if ! (cd "$OUT_DIR" && sha256sum -c sha256sums.txt); then
            exit 1
          fi
          mapfile -t top_level_files < <(find "$OUT_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_files < <(printf '%s\n' sha256sums.txt "${release_asset_names[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${expected_files[@]}") <(printf '%s\n' "${top_level_files[@]}"); then
            echo "release assets must be the verified top-level files only" >&2
            exit 1
          fi
          release_assets=("$OUT_DIR/sha256sums.txt")
          for asset_name in "${release_asset_names[@]}"; do
            release_assets+=("$OUT_DIR/$asset_name")
          done

          created_release=false
          cleanup_draft() {
            if [ "$created_release" = true ]; then
              gh release delete "$RELEASE_TAG" --yes || true
            fi
          }
          trap cleanup_draft ERR

          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$title" --notes-file "$notes" --draft --latest=false
          created_release=true
          gh release upload "$RELEASE_TAG" "${release_assets[@]}" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          created_release=false
          trap - ERR
